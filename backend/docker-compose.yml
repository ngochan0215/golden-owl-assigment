services:
  backend:
    build: .
    container_name: g-scores-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
  seed:
    build: .
    profiles: ["seed"]
    command: ["node", "config/seed.js"]
    env_file:
      - .env
